<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F6F0E6" />
  <title>红线 Red Thread · 你是哪一种东方恋人？</title>
  <meta name="description" content="1 分钟测出你的红线人格，再邀请 TA 看看你们合不合拍。Find your Red Thread type in one minute, then invite them to see how you match." />

  <!-- 分享预览 · Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="红线 Red Thread · 你是哪一种东方恋人？" />
  <meta property="og:description" content="1 分钟测出你的红线人格，再邀请 TA 看看你们合不合拍。Which Eastern lover are you?" />
  <!-- 分享预览图：换网址时，把下面 3 处 https://tiaz369.github.io/red-thread/ 一起改掉 -->
  <meta property="og:url" content="https://tiaz369.github.io/red-thread/" />
  <meta property="og:image" content="https://tiaz369.github.io/red-thread/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="红线 Red Thread — 你是哪一种东方恋人？ Which Eastern lover are you?" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Red Thread 红线 · Which Eastern lover are you?" />
  <meta name="twitter:description" content="Find your Red Thread type in one minute, then invite them to see how you match." />
  <meta name="twitter:image" content="https://tiaz369.github.io/red-thread/og.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />

  <!-- 统计（Cloudflare Web Analytics + GoatCounter）在 config.js 里设置，不用改这里 -->
</head>
<body>
  <header class="topbar">
    <button id="langToggle" class="lang-toggle" type="button" aria-label="Switch language">
      <span data-lang="zh">中</span> / <span data-lang="en">EN</span>
    </button>
  </header>

  <main id="app">
    <!-- 屏 1 · 首页 -->
    <section class="screen is-active" id="screen-home">
      <div class="home-inner">
        <p class="invite hidden" id="inviteLine"></p>
        <p class="edition-badge" data-i18n="edition"></p>
        <h1 class="title"></h1>
        <p class="subtitle" data-i18n="subtitle"></p>

        <!-- 3 张扇形展开的人格卡（由 app.js 填入） -->
        <div class="fan" id="fan" aria-hidden="true">
          <svg class="fan-thread" viewBox="0 0 340 120" preserveAspectRatio="none">
            <path class="thread-path" d="M-10 70 C 60 20, 110 110, 170 60 S 270 20, 350 60" />
          </svg>
        </div>

        <ul class="tags">
          <li data-i18n="tag1"></li><li data-i18n="tag2"></li><li data-i18n="tag3"></li>
        </ul>

        <button class="btn btn-primary" id="btnStart" type="button"></button>
        <button class="book-entry hidden" id="bookEntryHome" type="button"></button>

        <details class="about">
          <summary data-i18n="aboutQ"></summary>
          <p data-i18n="aboutA"></p>
        </details>

        <p class="valentine hidden" id="valentine"></p>
      </div>
    </section>

    <!-- 屏 2 · 输入 -->
    <section class="screen" id="screen-input">
      <form id="inputForm" class="form" novalidate>
        <h2 class="form-title" data-i18n="formTitle"></h2>

        <label class="field">
          <span class="field-label" data-i18n="nickname"></span>
          <input id="nickname" type="text" maxlength="12" autocomplete="nickname" required />
        </label>

        <div class="field">
          <span class="field-label" data-i18n="birthday"></span>
          <div class="row">
            <select id="bMonth" required aria-label="Month"></select>
            <select id="bDay" required aria-label="Day"></select>
          </div>
        </div>

        <fieldset class="field">
          <legend class="field-label" data-i18n="status"></legend>
          <div class="chips">
            <label class="chip"><input type="radio" name="status" value="single" required /><span data-i18n="st_single"></span></label>
            <label class="chip"><input type="radio" name="status" value="maybe" /><span data-i18n="st_maybe"></span></label>
            <label class="chip"><input type="radio" name="status" value="inlove" /><span data-i18n="st_inlove"></span></label>
            <label class="chip"><input type="radio" name="status" value="healing" /><span data-i18n="st_healing"></span></label>
          </div>
        </fieldset>

        <p class="form-error" id="formError" role="alert"></p>
        <button class="btn btn-primary" type="submit" data-i18n="next"></button>
        <p class="small-note" data-i18n="privacy"></p>
      </form>
    </section>

    <!-- 屏 2b · 情景题（每题一屏） -->
    <section class="screen" id="screen-quiz">
      <div class="quiz">
        <div class="quiz-top">
          <button class="btn-link back" id="quizBack" type="button" data-i18n="back"></button>
          <span class="quiz-step" id="quizStep"></span>
        </div>
        <div class="quiz-dots" id="quizDots" aria-hidden="true"><i></i><i></i><i></i></div>
        <h2 class="quiz-q" id="quizQ"></h2>
        <div class="quiz-options" id="quizOptions" role="radiogroup"></div>
      </div>
    </section>

    <!-- 屏 3 · 系线动画 -->
    <section class="screen" id="screen-tie" aria-live="polite">
      <svg class="tie-svg" viewBox="0 0 300 160" aria-hidden="true">
        <path class="tie-left"  d="M-10 80 C 50 40, 100 120, 140 80" />
        <path class="tie-right" d="M310 80 C 250 120, 200 40, 160 80" />
        <path class="tie-knot"  d="M140 80 C 150 60, 165 70, 150 82 C 135 94, 150 100, 160 80" />
      </svg>
      <p class="tie-text" data-i18n="tying"></p>
    </section>

    <!-- 屏 4 · 结果 -->
    <section class="screen" id="screen-result">
      <!-- 1. 人格 -->
      <div class="persona">
        <div class="persona-art" id="pArt"></div>
        <p class="persona-label" id="pLabel"></p>
        <p class="persona-desc" id="pDesc"></p>
        <div class="persona-traits">
          <p><span class="reading-label" data-i18n="shine"></span><span id="pShine"></span></p>
          <p><span class="reading-label" data-i18n="tip"></span><span id="pTip"></span></p>
        </div>
        <p class="want-line" id="pWant"></p>
        <p class="status-line" id="rStatus"></p>
      </div>

      <!-- 人格下方的快捷按钮 -->
      <div class="actions actions-top">
        <button class="btn btn-primary" id="btnSave2" type="button" data-i18n="save"></button>
        <button class="btn btn-outline" id="btnSend2" type="button" data-i18n="send"></button>
        <p class="small-note invite-unlock"></p>
      </div>

      <!-- 双人卡（通过邀请链接进来时显示） -->
      <div class="duo hidden" id="duo">
        <p class="section-label" data-i18n="duoLabel"></p>
        <h3 class="duo-title" id="duoTitle"></h3>
        <div class="duo-pair">
          <div class="duo-person"><div class="duo-art" id="duoArtA"></div><b id="duoNameA"></b><span id="duoPA"></span></div>
          <span class="duo-x">×</span>
          <div class="duo-person"><div class="duo-art" id="duoArtB"></div><b id="duoNameB"></b><span id="duoPB"></span></div>
        </div>
        <p class="duo-line" id="duoLine"></p>
        <button class="btn btn-secondary wide" id="btnSaveDuo" type="button" data-i18n="saveDuo"></button>
        <p class="small-note" data-i18n="duoNote"></p>

        <!-- 付费意愿测试：两个选项（还没有真实报告和会员，现在不会收费） -->
        <div class="report">
          <h4 class="report-title" data-i18n="reportTitle"></h4>
          <div class="plans">
            <!-- 选项 1：单份双人报告 -->
            <div class="plan" id="planReport" data-plan="duo-report">
              <p class="plan-name" data-i18n="planReportName"></p>
              <p class="plan-price"><b data-i18n="planReportPrice"></b><span data-i18n="planReportTerms"></span></p>
              <ol class="report-toc" id="reportToc"></ol>
              <button class="btn btn-outline plan-btn" type="button" data-i18n="reportBtn"></button>
            </div>
            <!-- 选项 2：红线会员 -->
            <div class="plan featured" id="planMember" data-plan="membership">
              <span class="plan-badge" data-i18n="planMemberBadge"></span>
              <p class="plan-name" data-i18n="planMemberName"></p>
              <p class="plan-price"><b data-i18n="planMemberPrice"></b><span data-i18n="planMemberTerms"></span></p>
              <ul class="plan-perks" id="memberPerks"></ul>
              <button class="btn btn-gold plan-btn" type="button" data-i18n="planMemberBtn"></button>
            </div>
          </div>
          <p class="small-note" data-i18n="reportNote"></p>
        </div>
      </div>

      <!-- 2. 今日缘分卡 -->
      <p class="section-label" data-i18n="todayCard"></p>
      <div class="card-stage">
        <div class="card" id="card">
          <div class="card-face card-back">
            <div class="back-pattern"></div>
          </div>
          <div class="card-face card-front" id="cardFront">
            <div class="card-no" id="cardNo"></div>
            <div class="card-art" id="cardArt"></div>
            <div class="card-name" id="cardName"></div>
            <div class="card-name-sub" id="cardNameSub"></div>
          </div>
        </div>
      </div>

      <div class="reading">
        <p class="message" id="rMessage"></p>
        <p class="message-sub" id="rMessageSub"></p>

        <!-- 这张卡的故事（典故） -->
        <div class="story">
          <span class="reading-label" data-i18n="storyTitle"></span>
          <p class="story-text clamp" id="storyText"></p>
          <p class="story-source" id="storySource"></p>
          <button class="btn-link story-toggle" id="storyToggle" type="button" aria-controls="storyText"></button>
        </div>

        <!-- 3. 反思 + 行动 -->
        <div class="reading-item">
          <span class="reading-label" data-i18n="question"></span>
          <p id="rQuestion"></p>
        </div>
        <div class="reading-item">
          <span class="reading-label" data-i18n="action"></span>
          <p id="rAction"></p>
        </div>
      </div>

      <!-- 4. 按钮 -->
      <div class="actions">
        <button class="btn btn-primary" id="btnSave" type="button" data-i18n="save"></button>
        <button class="btn btn-outline" id="btnSend" type="button" data-i18n="send"></button>
        <p class="small-note invite-unlock"></p>
      </div>

      <!-- 5. 每天一张 + 倒计时 -->
      <div class="lock">
        <p data-i18n="locked"></p>
        <p class="countdown" id="countdown">--:--:--</p>
        <p class="collect-tip" id="collectTip"></p>
        <button class="book-entry" id="bookEntryResult" type="button"></button>
      </div>

      <form class="waitlist" id="waitlistForm" novalidate>
        <h3 data-i18n="wlTitle"></h3>
        <p class="small-note" data-i18n="wlDesc"></p>
        <div class="row">
          <input type="email" id="wlEmail" name="email" required autocomplete="email" data-i18n-placeholder="wlPlaceholder" />
          <button class="btn btn-secondary" type="submit" data-i18n="wlJoin"></button>
        </div>
        <p class="small-note wl-msg" id="wlMsg" role="status"></p>
      </form>
    </section>

    <!-- 我的红线册 -->
    <section class="screen" id="screen-book">
      <div class="quiz-top">
        <button class="btn-link back" id="bookBack" type="button" data-i18n="bookBack"></button>
      </div>
      <h2 class="form-title" id="bookTitle"></h2>
      <p class="book-desc" id="bookDesc"></p>
      <button class="legend-btn" id="legendBtn" type="button"></button>
      <div class="book-grid" id="bookGrid"></div>
      <p class="small-note book-tap" data-i18n="bookTap"></p>
      <p class="small-note book-note" data-i18n="bookNote"></p>
    </section>
  </main>

  <!-- 红线册：重看卡片 / 月老的完整故事 -->
  <div class="modal hidden" id="sheet" role="dialog" aria-modal="true">
    <div class="modal-box sheet-box">
      <button class="modal-close" type="button" id="sheetClose" aria-label="Close">×</button>
      <div id="sheetBody"></div>
    </div>
  </div>

  <footer class="disclaimer" data-i18n="disclaimer"></footer>

  <!-- 付费意愿测试弹窗 -->
  <div class="modal hidden" id="payModal" role="dialog" aria-modal="true" aria-labelledby="payModalTitle">
    <form class="modal-box" id="payForm" novalidate>
      <button class="modal-close" type="button" id="payClose" aria-label="Close">×</button>
      <p class="pay-chosen" id="payChosen"></p>
      <h3 id="payModalTitle"></h3>
      <p class="small-note" id="payModalDesc"></p>
      <input type="email" id="payEmail" required autocomplete="email" data-i18n-placeholder="wlPlaceholder" />
      <label class="check"><input type="checkbox" id="payAgree" /><span data-i18n="payAgree"></span></label>
      <p class="form-error" id="payError" role="alert"></p>
      <button class="btn btn-primary" type="submit" data-i18n="paySubmit"></button>
      <p class="small-note pay-nocharge" id="payNoCharge"></p>
    </form>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <canvas id="shareCanvas" hidden></canvas>

  <script src="config.js"></script>
  <script src="cards.js"></script>
  <script src="draw.js"></script>
  <script src="personas.js"></script>
  <script src="lib/qrcode.js"></script>
  <script src="app.js"></script>
</body>
</html>
